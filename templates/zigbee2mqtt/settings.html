<form action="?" method="post" enctype="multipart/form-data" name="frmEdit" class="form-horizontal">
<fieldset>
	<div class="form-group">
		<h3 class="controls" style="padding-top:0.5em"><#LANG_Z2M_SETTINGS_MQTT#></h3>
	</div>
	
  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_MQTT_CLIENT#] style="color:red;font-weight:bold"[#endif#]><#LANG_SYSTEM_NAME#>:</label>
    <div class="col-sm-9">
      <input class="form-control" type="text" name="mqtt_client" value="<#MQTT_CLIENT#>">
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_MQTT_HOST#] style="color:red;font-weight:bold"[#endif#]><#LANG_HOSTNAME#>: (*)</label>
    <div class="col-sm-9">
      <input class="form-control" type="text" name="mqtt_host" value="<#MQTT_HOST#>">
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_MQTT_PORT#] style="color:red;font-weight:bold"[#endif#]><#LANG_PORT#>: (*)</label>
    <div class="col-sm-9">
      <input class="form-control" type="text" name="mqtt_port" value="<#MQTT_PORT#>">
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_MQTT_QUERY#] style="color:red;font-weight:bold"[#endif#]><#LANG_Z2M_LABEL_SUBSCRIPTION#>: (*)</label>
    <div class="col-sm-9">
      <input class="form-control" type="text" name="mqtt_query" value="<#MQTT_QUERY#>">
    <label >(<#LANG_Z2M_HINT_GATEWAYS#>)</label>
    </div>
  </div>  
  
	<div class="form-group">
	 <div class="controls">
	 <label><input type="checkbox" name="mqtt_auth" value="1"[#if MQTT_AUTH="1"#] checked[#endif#]> <#LANG_AUTHORIZATION_REQUIRED#></label>
	 </div>
	</div>  
  
  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_MQTT_QUERY#] style="color:red;font-weight:bold"[#endif#]><#LANG_Z2M_LABEL_AUTH#>:</label>
    <div class="col-sm-9">
      <div class="form-inline form-group">
		  <div class="input-group col-sm-6">
			<span class="input-group-addon"><span class="glyphicon glyphicon-user"></span></span>
			<input type="text" name="mqtt_username" value="<#MQTT_USERNAME#>" class="form-control" placeholder="<#LANG_Z2M_LOGIN#>">
		  </div>
		  <div class="input-group col-sm-6">
			<span class="input-group-addon"><span class="glyphicon glyphicon-lock"></span></span>
			<input type="password" name="mqtt_password" value="<#MQTT_PASSWORD#>" class="form-control" placeholder="<#LANG_Z2M_PASSWORD#>">
		  </div>	  
	  </div>
    </div>
  </div>  

 	<div class="form-group">
		<h3 class="controls"><#LANG_Z2M_SETTINGS_Z2M#></h3>
	</div> 
	
	
	
  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_MQTT_QUERY#] style="color:red;font-weight:bold"[#endif#]><#LANG_Z2M_LABEL_FOLDER#>:</label>
    <div class="col-sm-9">
      <input class="form-control" type="text" name="zigbee2mqttpath" value="<#ZIGBEE2MQTTPATH#>">
    <label >(<#LANG_Z2M_HINT_FOLDER#>)</label>
    </div>
  </div> 

  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_Z2M_LOGMODE#] style="color:red;font-weight:bold"[#endif#]><#LANG_Z2M_LABEL_LOGLEVEL#> [#Z2M_LOGMODE#]:</label>
    <div class="col-sm-9">
     <select name="z2m_logmode2" id="z2m_logmode2" class="form-control">
      <option value="debug"[#if Z2M_LOGMODE="debug"#] selected[#endif#]>debug</option>
      <option value="info"[#if Z2M_LOGMODE="info"#] selected[#endif#]>info</option>
      <option value="warn"[#if Z2M_LOGMODE="warn"#] selected[#endif#]>warn</option>
      <option value="error"[#if Z2M_LOGMODE="error"#] selected[#endif#]>error</option>
     </select>
    </div>
  </div>
  


 	<div class="form-group">
		<h3 class="controls"><#LANG_Z2M_SETTINGS_SLS#></h3>
	</div> 
	
	
	
  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_MQTT_QUERY#] style="color:red;font-weight:bold"[#endif#]><#LANG_Z2M_LABEL_SLS_IP#> :</label>



    <div class="col-sm-9">
      <input class="form-control" type="text" name="slsip" value="<#SLSIP#>">
    <label >(<#LANG_Z2M_HINT_SLS#>)</label>
    </div>
  </div> 
  

<div class="form-group">
		<h3 class="controls"><#LANG_Z2M_SETTINGS_SYSTEM#></h3>
	</div> 

  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_Z2M_HIST#] style="color:red;font-weight:bold"[#endif#]><#LANG_Z2M_LABEL_HISTORY#>:</label>
    <div class="col-sm-9">
      <input class="form-control" type="text" name="z2m_hist" value="<#Z2M_HIST#>">
      <label ><#LANG_Z2M_HINT_HISTORY#></label>
    </div>
  </div>


  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_VIEW#] style="color:red;font-weight:bold"[#endif#]><#LANG_Z2M_LABEL_VIEW#>:</label>
    <div class="col-sm-9">
		 <select name="z2m_view" id="z2m_view" class="form-control">
		  <option value="container-fluid"[#if Z2M_VIEW="container-fluid"#] selected[#endif#]><#LANG_Z2M_VIEW_TILES#></option>
		  <option value="table"[#if Z2M_VIEW="table"#] selected[#endif#]><#LANG_Z2M_VIEW_TABLE#></option>
		 </select>
    </div>
  </div> 


  <div class="form-group">
    <label class="col-sm-3 control-label" [#if ERR_Z2M_NTILES#] style="color:red;font-weight:bold"[#endif#]><#LANG_Z2M_LABEL_NTILES#>:</label>
    <div class="col-sm-9">
		 <select name="z2m_ntiles" id="z2m_ntiles" class="form-control">
		  <option value="3"[#if Z2M_NTILES="3"#] selected[#endif#]>3</option>
		  <option value="4"[#if Z2M_NTILES="4"#] selected[#endif#]>4</option>
		  <option value="5"[#if Z2M_NTILES="5"#] selected[#endif#]>5</option>
		  <option value="6"[#if Z2M_NTILES="6"#] selected[#endif#]>6</option>

		 </select>
    </div>
  </div> 



	<div class="form-group">
	 <div class="controls">
	 <label><input type="checkbox" name="mqtt_debug" value="1"[#if MQTT_DEBUG="1"#] checked[#endif#]> <#LANG_Z2M_LABEL_DEBUG#> [#ZMQTT_DEBUG#]</label>
	 </div>
	</div> 


	
 
<div class="form-actions">
<button type="submit" name="subm" value="Submit" class="btn btn-primary"><#LANG_UPDATE#></button>
<input type="hidden" name="view_mode" value="update_settings">
<input type="hidden" name="mode" value="update">
<input type="hidden" name="tab" value="settings">
</div>  
</fieldset>
</form>
